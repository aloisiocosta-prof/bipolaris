name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter --version
      - run: flutter create . --platforms web,android --project-name bipolaris
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --wasm
      - run: flutter build apk --debug
