name: Flutter and academic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter --version
      - run: flutter create . --platforms web,android --project-name bipolaris
      - run: flutter pub get
      - name: Temporary formatter output
        run: |
          dart format --output=show lib/main.dart | sed -n '275,290p'
          dart format --output=show lib/main.dart | sed -n '555,575p'
          dart format --output=show test/widget_test.dart | sed -n '10,55p'
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: ./tool/build_web.sh
      - run: flutter build apk --debug
      - name: Upload Web/PWA proof
        uses: actions/upload-artifact@v7
        with:
          name: bipolaris-web-preview
          path: build/web
          retention-days: 14

  academic-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile ABNT manuscript and work-in-progress poster
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            presentation/poster.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Install PDF inspection utility
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate PDF outputs
        run: |
          test -s paper/main.pdf
          test -s presentation/poster.pdf
          pdfinfo paper/main.pdf
          pdfinfo presentation/poster.pdf
      - name: Upload academic proof PDFs
        uses: actions/upload-artifact@v7
        with:
          name: bipolaris-academic-preview
          path: |
            paper/main.pdf
            presentation/poster.pdf
          retention-days: 14
