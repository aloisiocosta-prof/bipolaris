name: Build versioned academic release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Resolve and validate SemVer release
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          ref = os.environ["REF_NAME"]
          tag = ref.removeprefix("release/")
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Branch must be release/vMAJOR.MINOR.PATCH; received {ref}")
          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version:\s*([^+\s]+)", pubspec)
          if not match or match.group(1) != tag.removeprefix("v"):
              raise SystemExit(f"Release tag {tag} must match pubspec version {match.group(1) if match else 'missing'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter create . --platforms web,android --project-name bipolaris
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: ./tool/build_web.sh
      - name: Compile article and poster PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            presentation/poster.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Prepare versioned release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          command -v pdfinfo >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          mkdir -p release-assets
          cp paper/main.pdf "release-assets/bipolaris-article-${TAG}.pdf"
          cp presentation/poster.pdf "release-assets/bipolaris-poster-banner-${TAG}.pdf"
          (cd build/web && zip -qr "${GITHUB_WORKSPACE}/release-assets/bipolaris-web-pages-${TAG}.zip" .)
          pdfinfo "release-assets/bipolaris-article-${TAG}.pdf"
          pdfinfo "release-assets/bipolaris-poster-banner-${TAG}.pdf"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/web/manifest.json").read_text(encoding="utf-8"))
          assert manifest["name"] == "Bipolaris"
          assert manifest["start_url"] == "/bipolaris/"
          assert Path("build/web/sw.js").is_file()
          assert Path("build/web/index.html").is_file()
          PY
          {
            echo "Version: ${TAG}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Web target: Flutter WebAssembly GC, hosted at /bipolaris/"
            echo "Research status: proposed protocol; no empirical results"
            echo "Generated (UTC): $(date -u +%FT%TZ)"
          } > release-assets/BUILD-INFO.txt
          (cd release-assets && sha256sum bipolaris-article-${TAG}.pdf bipolaris-poster-banner-${TAG}.pdf bipolaris-web-pages-${TAG}.zip BUILD-INFO.txt > SHA256SUMS.txt)
      - name: Preserve build outputs
        uses: actions/upload-artifact@v7
        with:
          name: bipolaris-release-${{ steps.version.outputs.tag }}
          path: release-assets/
          retention-days: 90
      - name: Create draft release and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" release-assets/*             --draft             --target "${COMMIT}"             --title "Bipolaris ${TAG}"             --notes "Protocolo acadêmico e artefatos do protótipo. O artigo e o banner descrevem uma proposta de pesquisa em andamento; não apresentam resultados empíricos, aprovação ética ou validação clínica. O ZIP contém a build Flutter Web/WasmGC com PWA para o caminho /bipolaris/."
          gh release edit "${TAG}" --draft=false --latest
